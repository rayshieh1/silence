// 🌸 #N 專屬獨立直出渲染通道（優先比對原廠編號 origId，若無則自動跳到下一個原廠編號）
function handleNumberDirectSearch(targetNum, inputElem) {
    var targetCard = aphorismsData.find(function(item) {
        return parseInt(item.origId, 10) === targetNum;
    });

    if (!targetCard) {
        var nextList = aphorismsData.filter(function(item) {
            return parseInt(item.origId, 10) > targetNum;
        }).sort(function(a, b) {
            return parseInt(a.origId, 10) - parseInt(b.origId, 10);
        });
        targetCard = (nextList.length > 0) ? nextList[0] : aphorismsData[0];
    }

    var selected = [targetCard];
    var usedMap = {};
    usedMap[targetCard.id] = true;

    var relatedTags = targetCard.semanticTags || [];
    var poolCards = aphorismsData.filter(function(item) {
        if (usedMap[item.id]) return false;
        return relatedTags.some(function(t) { return item.semanticTags && item.semanticTags.indexOf(t) !== -1; });
    });

    for (var r = 0; r < poolCards.length && selected.length < 3; r++) {
        selected.push(poolCards[r]);
        usedMap[poolCards[r].id] = true;
    }

    for (var g = 0; g < aphorismsData.length && selected.length < 3; g++) {
        if (!usedMap[aphorismsData[g].id]) {
            selected.push(aphorismsData[g]);
            usedMap[aphorismsData[g].id] = true;
        }
    }

    renderCardsDirectly(selected, targetCard);

    if (window.history && history.replaceState) {
        history.replaceState(null, '', location.pathname + location.search + '#' + targetCard.origId);
    }

    inputElem.placeholder = "#" + targetCard.origId;
    inputElem.value = "";
}

function renderCardsDirectly(selected, primaryCard) {
    var list = document.getElementById('resultsList');
    if (!list) return;

    currentDisplayedCards = selected.slice();
    lastDisplayedIds = selected.map(function(item) { return item.id; });

    selected.forEach(function(item) {
        aphorismShowCounts[item.id] = (aphorismShowCounts[item.id] || 0) + 1;
    });

    buildTopKeywordsByRules(selected, "", primaryCard.semanticTags || []);
    renderKeywordsHeader();

    list.innerHTML = '';

    for (var s = 0; s < selected.length; s++) {
        var item = selected[s];

        var card = document.createElement('div'); card.className = 'card';
        var mainBody = document.createElement('div'); mainBody.className = 'card-main-body';

        var contentP = document.createElement('p'); contentP.className = 'card-content'; contentP.textContent = item.content;
        
        var rightSide = document.createElement('div'); rightSide.className = 'card-right-side';

        var speakBtn = document.createElement('button');
        speakBtn.className = 'btn-speak'; speakBtn.innerHTML = '🔊'; speakBtn.type = 'button'; speakBtn.title = '點擊朗讀';
        (function(textToSpeak, btn){ speakBtn.onclick = function() { speakText(textToSpeak, btn); }; })(item.content, speakBtn);

        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'card-checkbox';
        checkbox.setAttribute('data-card-id', item.id);
        checkbox.onchange = function() {
            var customCb = document.getElementById('customInputCheckbox');
            if (customCb && customCb.checked) customCb.checked = false;
            var aiCheckbox = document.querySelector('.ai-card .card-checkbox');
            if (aiCheckbox && aiCheckbox.checked) aiCheckbox.checked = false;
            updateAiButtonState();
        };

        rightSide.appendChild(speakBtn); 
        rightSide.appendChild(checkbox);
        rightSide.appendChild(createQuoteLinkSpan(item.origId));
        rightSide.appendChild(createQuoteCopyButton(item.origId));

        mainBody.appendChild(contentP); 
        mainBody.appendChild(rightSide);

        var metaDiv = document.createElement('div'); metaDiv.className = 'card-meta';
        var tagContainer = document.createElement('div'); tagContainer.className = 'tag-list-container';

        var displayCardTags = item.semanticTags || [];
        for (var t = 0; t < displayCardTags.length; t++) {
            (function(tag){
                var tb = document.createElement('button'); tb.className = 'card-tag-btn';
                if (selectedUserTags.indexOf(tag) !== -1) tb.classList.add('active');
                tb.textContent = tag; tb.type = 'button';
                tb.onclick = function() { toggleTagSelection(tag); };
                tagContainer.appendChild(tb);
            })(displayCardTags[t]);
        }

        metaDiv.appendChild(tagContainer);
        card.appendChild(mainBody); card.appendChild(metaDiv);
        list.appendChild(card);
    }

    ensureButtonsInDefaultPos();
    updateAiButtonState();
}

        if (numMatches) {
            var targetNum = parseInt(numMatches[0], 10);
            if (targetNum > 0) {
                lastSearchText = "";
                handleNumberDirectSearch(targetNum, inputElem);
                return;
            }
        }
    }

    if (trimmed !== "") {
        selectedUserTags = [];
        lastSearchText = trimmed;
        renderUI(false, [], false, false, trimmed);
        inputElem.placeholder = trimmed;
        inputElem.value = "";
    } else {
        if (selectedUserTags.length === 0) {
            renderUI(false, [], true, false, null);
        } else {
            inputElem.placeholder = defaultPlaceholderText;
            renderUI(false, selectedUserTags.slice(), false, true, null);
        }
    }
};

function cardHasExactTag(item, tag) {
    if (!tag) return true;
    return item.semanticTags && item.semanticTags.indexOf(tag) !== -1;
}

function pushUniqueCard(targetArr, item, usedMap) {
    if (item && !usedMap[item.id] && targetArr.length < 3) {
        targetArr.push(item);
        usedMap[item.id] = true;
        return true;
    }
    return false;
}

function getExactHitsCount(item, tagsArr) {
    var count = 0;
    for (var i = 0; i < tagsArr.length; i++) {
        if (cardHasExactTag(item, tagsArr[i])) count++;
    }
    return count;
}

function sortByExposureAndRandom(pool) {
    return pool.slice().sort(function(a, b) {
        var cA = aphorismShowCounts[a.id] || 0;
        var cB = aphorismShowCounts[b.id] || 0;
        if (cA === cB) return 0.5 - Math.random();
        return cA - cB;
    });
}

function getCardsByTags(targetTags, limitCount, usedIdMap) {
    var result = [];
    if (!targetTags || targetTags.length === 0) {
        var fallback = sortByExposureAndRandom(aphorismsData);
        for (var i = 0; i < fallback.length && result.length < limitCount; i++) {
            pushUniqueCard(result, fallback[i], usedIdMap);
        }
        return result;
    }

    var matched = sortByExposureAndRandom(aphorismsData.filter(function(item) {
        return !usedIdMap[item.id] && targetTags.some(function(t) { return cardHasExactTag(item, t); });
    }));

    for (var m = 0; m < matched.length && result.length < limitCount; m++) {
        pushUniqueCard(result, matched[m], usedIdMap);
    }

    if (result.length < limitCount) {
        var globalFb = sortByExposureAndRandom(aphorismsData);
        for (var g = 0; g < globalFb.length && result.length < limitCount; g++) {
            pushUniqueCard(result, globalFb[g], usedIdMap);
        }
    }

    return result;
}

// 🌸 下方兩顆按鈕：字盡量放大（最大 15px），太長時自動縮小到剛好放得下，按鈕寬高不變
function fitTextToButton(btn, maxPx, minPx) {
    if (!btn || !btn.style) return;
    var size = maxPx;
    btn.style.fontSize = size + 'px';
    var guard = 0;
    while (btn.scrollWidth > btn.clientWidth && size > minPx && guard < 40) {
        size -= 0.5;
        btn.style.fontSize = size + 'px';
        guard++;
    }
}

// 🌸 依灰底時的文字決定字體大小，按下後（反白）的文字也用同樣大小
function fitButtonUsingLabel(btn, baseLabel, maxPx, minPx) {
    if (!btn || !btn.style) return;
    var actualLabel = btn.textContent;
    btn.textContent = baseLabel;
    fitTextToButton(btn, maxPx, minPx);
    var size = parseFloat(btn.style.fontSize) || maxPx;
    btn.textContent = actualLabel;
    btn.style.fontSize = size + 'px';
    // 保險：萬一反白文字比灰底長，才再縮小到剛好放得下
    var guard = 0;
    while (btn.scrollWidth > btn.clientWidth && size > minPx && guard < 40) {
        size -= 0.5;
        btn.style.fontSize = size + 'px';
        guard++;
    }
}

function generateAiAphorism() {
    var selectedCheckboxes = document.querySelectorAll('.card-checkbox:checked');
    if (selectedCheckboxes.length < 2) return;

    var chosenCards = [];
    selectedCheckboxes.forEach(function(cb) {
        var cardId = parseInt(cb.getAttribute('data-card-id'), 10);
        var found = aphorismsData.find(function(item) { return item.id === cardId; });
        if (found) chosenCards.push(found);
    });

    var collectedTags = [];
    chosenCards.forEach(function(c) {
        c.semanticTags.forEach(function(t) {
            if (collectedTags.indexOf(t) === -1) collectedTags.push(t);
        });
    });

    // 🌸 輸入框的意思：目前輸入框的文字，沒有的話用最近一次搜尋的文字
    var promptElem = document.getElementById('userPrompt');
    var inputText = (promptElem && promptElem.value ? promptElem.value.trim() : '') || lastSearchText || '';
    var inputTags = textToAiTags(inputText);

    // 🌸 智慧挑選句型：依負面詞類別篩選，再依主題與「輸入框的意思」「勾選金句標籤」的重疊程度打分數
    //    輸入框的詞優先（權重 2），勾選金句的標籤其次（權重 1）
    function uniqueMerge(a, b) {
        var out = a.slice();
        b.forEach(function(t) { if (out.indexOf(t) === -1) out.push(t); });
        return out;
    }
    var inputNegs = inputTags.filter(function(t) { return negTagList.indexOf(t) !== -1; });
    var cardNegs = collectedTags.filter(function(t) { return negTagList.indexOf(t) !== -1; });
    var selectedNegs = uniqueMerge(inputNegs, cardNegs);
    var negCategory = selectedNegs.length > 0 ? aiNegCategoryOf(selectedNegs[0]) : null;
    var inputPos = inputTags.filter(function(t) { return aiPosWordList.indexOf(t) !== -1; });
    var cardPos = collectedTags.filter(function(t) { return aiPosWordList.indexOf(t) !== -1; });
    var availablePos = uniqueMerge(inputPos, cardPos);

    var candidates = [];
    aiTemplates.forEach(function(tp, idx) {
        if (negCategory) {
            if (tp.neg.indexOf(negCategory) !== -1) candidates.push(idx);
        } else {
            if (tp.neg.length === 0 || tp.neg.indexOf('情') !== -1) candidates.push(idx);
        }
    });

    var freshCandidates = candidates.filter(function(idx) { return recentTemplateIndices.indexOf(idx) === -1; });
    if (freshCandidates.length === 0) {
        recentTemplateIndices = [];
        freshCandidates = candidates.slice();
    }

    var scored = freshCandidates.map(function(idx) {
        var tp = aiTemplates[idx];
        var score = 0;
        tp.th.forEach(function(th) {
            if (inputTags.indexOf(th) !== -1) score += 2;
            else if (collectedTags.indexOf(th) !== -1) score += 1;
        });
        if (!negCategory && tp.neg.length === 0) score += 2;
        if (tp.t.indexOf('【POS3】') !== -1) {
            if (chosenCards.length >= 3 && availablePos.length >= 3) score += 2;
            else score -= 1;
        }
        return { idx: idx, score: score };
    });
    var maxScore = Math.max.apply(null, scored.map(function(x) { return x.score; }));
    var pool = scored.filter(function(x) { return x.score >= maxScore; });
    if (pool.length < 3) pool = scored.filter(function(x) { return x.score >= maxScore - 1; });

    var chosenIndex = pool[Math.floor(Math.random() * pool.length)].idx;
    recentTemplateIndices.push(chosenIndex);
    if (recentTemplateIndices.length > 10) {
        recentTemplateIndices.shift();
    }

    var randomTemplate = aiTemplates[chosenIndex].t;

    // 🌸 只挑美德類正面詞，並避開句型裡已經出現的字，避免「以包容包容」這類重複
    var templatePlainText = randomTemplate.replace(/【(POS|NEG)\d】/g, '').replace(/｜/g, '');
    function notInTemplate(t) { return templatePlainText.indexOf(t) === -1; }

    var posPool = availablePos.filter(notInTemplate);
    var useCategory = negCategory || '情';
    var negPool = selectedNegs.filter(function(t) { return aiNegCategoryOf(t) === useCategory && notInTemplate(t); });

    ["智慧", "平靜", "感恩", "包容", "知足", "善念"].forEach(function(t) {
        if (posPool.length < 3 && posPool.indexOf(t) === -1 && notInTemplate(t)) posPool.push(t);
    });
    aiNegCategories[useCategory].forEach(function(t) {
        if (negPool.length < 2 && negPool.indexOf(t) === -1 && notInTemplate(t)) negPool.push(t);
    });

    var pos1 = posPool[0];
    var pos2 = posPool[1];
    var pos3 = posPool[2];
    var neg1 = negPool[0];
    var neg2 = negPool[1];

    var filledTemplate = randomTemplate
        .replace(/【POS1】/g, pos1)
        .replace(/【POS2】/g, pos2)
        .replace(/【POS3】/g, pos3)
        .replace(/【NEG1】/g, neg1)
        .replace(/【NEG2】/g, neg2);

    var generatedText = filledTemplate.replace(/｜/g, '');
    currentGeneratedAphorismLines = filledTemplate.split('｜');

    currentGeneratedAphorismText = generatedText;

    var aiResultBox = document.getElementById('aiResultBox');
    if (!aiResultBox) return;

    aiResultBox.innerHTML = '';
    
    var aiCard = document.createElement('div');
    aiCard.className = 'ai-card';

    var mainBody = document.createElement('div');
    mainBody.className = 'card-main-body';

    var contentP = document.createElement('p');
    contentP.className = 'card-content';
    contentP.style.color = '#334155';
    contentP.style.fontWeight = 'bold';
    contentP.textContent = generatedText;

    var rightSide = document.createElement('div');
    rightSide.className = 'card-right-side';

    var topBtnsDiv = document.createElement('div');
    topBtnsDiv.className = 'ai-card-top-btns';

    var speakBtn = document.createElement('button');
    speakBtn.className = 'btn-speak';
    speakBtn.innerHTML = '🔊';
    speakBtn.type = 'button';
    speakBtn.title = '點擊朗讀';
    speakBtn.onclick = function() { speakText(generatedText, speakBtn); };

    var aiCheckbox = document.createElement('input');
    aiCheckbox.type = 'checkbox';
    aiCheckbox.className = 'card-checkbox';
    aiCheckbox.setAttribute('data-card-id', '9999'); 
    aiCheckbox.onchange = function() { handleAiCheckboxClick(this); };

    topBtnsDiv.appendChild(speakBtn);
    topBtnsDiv.appendChild(aiCheckbox);

    var copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.innerHTML = copySvg;
    copyBtn.type = 'button';
    copyBtn.title = '複製結緣語';
    copyBtn.onclick = function() { copyAiAphorismToClipboard(generatedText, copyBtn); };

    rightSide.appendChild(topBtnsDiv);
    rightSide.appendChild(copyBtn);

    mainBody.appendChild(contentP);
    mainBody.appendChild(rightSide);

    var metaDiv = document.createElement('div');
    metaDiv.className = 'card-meta';
    metaDiv.style.paddingBottom = '2px';

    var tagContainer = document.createElement('div');
    tagContainer.className = 'tag-list-container';

    collectedTags.forEach(function(tag) {
        var tb = document.createElement('button');
        tb.className = 'card-tag-btn';
        if (selectedUserTags.indexOf(tag) !== -1) tb.classList.add('active');
        tb.textContent = tag;
        tb.type = 'button';
        tb.onclick = function() { toggleTagSelection(tag); };

    cardBtnRow.appendChild(aiBtn);
    cardBtnRow.appendChild(morningBtn);

    ensureButtonsInDefaultPos();

    aiCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

function drawLandscapeBackground(ctx, width, height, callback) {
    function imagesFor(uses) {
        return backgroundImages.filter(function(b) { return uses.indexOf(b.use) !== -1; });
    }

    var candidates = [];
    if (currentSelectedGreeting === '早安') {
        candidates = imagesFor(['早安', '白天']);
    } else if (currentSelectedGreeting === '日安') {
        candidates = imagesFor(['白天', '不選']);
    } else if (currentSelectedGreeting === '晚安') {
        candidates = imagesFor(['晚安']);
    } else {
        var noGreetingImages = imagesFor(['不選']);
        candidates = noGreetingImages;

        var numericId = currentSelectedCardId ? parseInt(currentSelectedCardId, 10) : null;
        var foundCard = numericId ? aphorismsData.find(function(item){ return item.id === numericId; }) : null;

        if (foundCard && foundCard.semanticTags) {
            var tags = foundCard.semanticTags;
            for (var g = 0; g < backgroundThemeGroups.length; g++) {
                var group = backgroundThemeGroups[g];
                var hit = group.tags.some(function(t) { return tags.indexOf(t) !== -1; });
                if (hit) {
                    var themed = noGreetingImages.filter(function(b) { return group.nos.indexOf(b.no) !== -1; });
                    if (themed.length >= 3) candidates = themed;
                    break;
                }
            }
        }
    }

    if (candidates.length === 0) candidates = backgroundImages;
    var chosenBg = candidates[Math.floor(Math.random() * candidates.length)];
    var randomImgUrl = chosenBg.url;
    currentBackgroundNo = chosenBg.no;
    // 🌸 裁切位置：focusX／focusY 為 0～1（0＝最左／最上，0.5＝置中，1＝最右／最下），沒設定就置中
    var focusX = (typeof chosenBg.focusX === 'number') ? chosenBg.focusX : 0.5;
    var focusY = (typeof chosenBg.focusY === 'number') ? chosenBg.focusY : 0.5;
    var img = new Image();
    img.crossOrigin = 'Anonymous';

    var hasResponded = false;
    var loadTimeout = setTimeout(function() {
        if (!hasResponded) {
            hasResponded = true;
            drawFallbackCanvasBackground(ctx, width, height, callback);
        }
    }, 3000);

    img.onload = function() {
        if (hasResponded) return;
        hasResponded = true;
        clearTimeout(loadTimeout);

        var imgAspect = img.width / img.height;
        var canvasAspect = width / height;
        var renderW, renderH, offsetX, offsetY;

        if (imgAspect > canvasAspect) {
            renderH = height;
            renderW = height * imgAspect;
            offsetX = (width - renderW) * focusX;
            offsetY = 0;
        } else {
            renderW = width;
            renderH = width / imgAspect;
            offsetX = 0;
            offsetY = (height - renderH) * focusY;
        }

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, offsetX, offsetY, renderW, renderH);

        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(0, 0, width, height);

        if (callback) callback();
    };

    img.onerror = function() {
        if (hasResponded) return;
        hasResponded = true;
        clearTimeout(loadTimeout);
        drawFallbackCanvasBackground(ctx, width, height, callback);
    };

    img.src = randomImgUrl;
}

function drawFallbackCanvasBackground(ctx, width, height, callback) {
    var themes = ['ocean', 'mountain', 'bamboo', 'sunset', 'cherry_night'];
    var chosen = themes[Math.floor(Math.random() * themes.length)];

    if (chosen === 'ocean') { 
        var sky = ctx.createLinearGradient(0, 0, 0, height * 0.45);
        sky.addColorStop(0, '#4a90e2'); sky.addColorStop(1, '#d0e5f2');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, width, height * 0.45);

        var sea = ctx.createLinearGradient(0, height * 0.45, 0, height);
        sea.addColorStop(0, '#1f6f8b'); sea.addColorStop(1, '#0e313d');
        ctx.fillStyle = sea; ctx.fillRect(0, height * 0.45, width, height * 0.55);
    } else if (chosen === 'mountain') { 
        var bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, '#2b5876'); bg.addColorStop(1, '#4e4376');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'rgba(20, 30, 48, 0.85)';
        ctx.beginPath();
        ctx.moveTo(0, height * 0.7);
        ctx.lineTo(width * 0.35, height * 0.52);
        ctx.lineTo(width * 0.7, height * 0.72);
        ctx.lineTo(width, height * 0.58);
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        ctx.closePath(); ctx.fill();
    } else if (chosen === 'bamboo') { 
        var bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, '#134e5e'); bg.addColorStop(1, '#71b280');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);
    } else if (chosen === 'sunset') { 
        var bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, '#f83600'); bg.addColorStop(0.6, '#fe8c00'); bg.addColorStop(1, '#f7b733');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);
    } else { 
        var bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, '#0f2027'); bg.addColorStop(0.5, '#203a43'); bg.addColorStop(1, '#2c5364');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#fffdf0';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.8)'; ctx.shadowBlur = 30 * CANVAS_SCALE;
        ctx.beginPath(); ctx.arc(width * 0.5, height * 0.2, 50, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
    ctx.fillRect(0, 0, width, height);

    if (callback) callback();
}

// 🌸 金句畫布斷句：依「新的版本」為每句指定的斷句（lines）
function splitTextSmartRhythm(text, cardId) {
    if (!text) return [];

    if (cardId === 'custom_input') {
        var cleanStr = text.trim();
        return cleanStr.split(/\r?\n/).filter(function(p){ return p.trim().length > 0; }).slice(0, 3);
    }

    if (cardId === '9999' && text === currentGeneratedAphorismText && currentGeneratedAphorismLines.length > 0) {
        return currentGeneratedAphorismLines.slice();
    }

    if (cardId === '9999') {
        var matchThreePart = text.match(/^(.+?[，；])(.+?[，；])(.+)$/);
        if (matchThreePart) {
            return [
                matchThreePart[1].trim(),
                matchThreePart[2].trim(),
                matchThreePart[3].trim()
            ];
        }
    }

    var numericId = parseInt(cardId, 10);
    var found = null;
    if (!isNaN(numericId)) {
        found = aphorismsData.find(function(item) { return item.id === numericId; });
    }
    if (!found) {
        found = aphorismsData.find(function(item) { return item.content === text; });
    }
    if (found && found.lines && found.lines.length > 0) {
        return found.lines.slice();
    }

    var semiIdx = text.indexOf("；");
    if (semiIdx !== -1 && semiIdx > 3 && semiIdx < text.length - 3) {
        return [text.substring(0, semiIdx + 1).trim(), text.substring(semiIdx + 1).trim()];
    }

    var commaIndices = [];
    for (var c = 0; c < text.length; c++) {
        if (text[c] === '，') commaIndices.push(c);
    }

    if (commaIndices.length > 0) {
        var mid = text.length / 2;
        var bestIdx = commaIndices[0];
        var minDiff = Math.abs(commaIndices[0] - mid);
        for (var k = 1; k < commaIndices.length; k++) {
            var diff = Math.abs(commaIndices[k] - mid);
            if (diff < minDiff) {
                minDiff = diff;
                bestIdx = commaIndices[k];
            }
        }
        var line1 = text.substring(0, bestIdx + 1).trim();
        var line2 = text.substring(bestIdx + 1).trim();
        if (line1.length > 0 && line2.length > 0) {
            return [line1, line2];
        }
    }

    if (text.length > 12) {
        var half = Math.ceil(text.length / 2);
        return [text.substring(0, half), text.substring(half)];
    }

    return [text];
}

function adaptQuotationMarks(text, aspectMode) {
    if (!text) return text;
    if (aspectMode === 'portrait') {
        return text
            .replace(/「/g, "﹁")
            .replace(/」/g, "﹂")
            .replace(/"([^"]*)"/g, "﹁$1﹂");
    }
    return text;
}

// 🌸 畫問候圖前，先讓瀏覽器下載霞鶩文楷（只抓用得到的字，最多等 3 秒，逾時改用系統字體）
function ensureKaiFontLoaded(sampleText) {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var sample = (sampleText || '') + '靜思語錄早安晚安!~' + daytimeGreetingsPool.join('');
    var loadPromise = document.fonts.load('bold 36px "LXGW WenKai TC"', sample).catch(function() {});
    var timeoutPromise = new Promise(function(resolve) { setTimeout(resolve, 3000); });
    return Promise.race([loadPromise, timeoutPromise]);
}

function openMorningModal(aphorismText, aspectMode, cardId) {
    currentShareFile = null;
    currentModalText = aphorismText;
    currentAspectMode = aspectMode || 'portrait'; 

    updateGreetingButtonsUI();

    var toggleBtn = document.getElementById('toggleAspectBtn');
    if (toggleBtn) {
        if (currentAspectMode === 'portrait') {
            toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="1.5" stroke-width="2.2"></rect><path d="M12 17v3" stroke-width="2.2"></path><path d="M6 21c3-0.8 9-0.8 12 0" stroke-width="2.2"></path></svg><span>橫幅</span>';
        } else {
            toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5" stroke-width="2.2"></rect><line x1="10" y1="4" x2="14" y2="4" stroke-width="2"></line><circle cx="12" cy="19" r="1" fill="currentColor"></circle></svg><span>直式</span>';
        }
    }

    var lineBtn = document.getElementById('btnLineShare');
    if (lineBtn) {
        if (currentSelectedCardId === '9999' || currentSelectedCardId === 'custom_input') {
            lineBtn.title = "用 LINE 傳送問候語";
        } else {
            lineBtn.title = "用 LINE 傳送金句";
        }
    }

    var modal = document.getElementById('morningModal');
    var canvas = document.getElementById('morningCanvas');
    var imgOverlay = document.getElementById('morningImgOverlay');
    var ctx = canvas.getContext('2d');

    var canvasW = (currentAspectMode === 'landscape') ? 800 : 450;
    var canvasH = (currentAspectMode === 'landscape') ? 450 : 800;
    
    canvas.width = canvasW * CANVAS_SCALE;
    canvas.height = canvasH * CANVAS_SCALE;
    ctx.setTransform(CANVAS_SCALE, 0, 0, CANVAS_SCALE, 0, 0);

    ctx.clearRect(0, 0, canvasW, canvasH);

    var rawLines = (aphorismText && aphorismText.trim() !== "") ? splitTextSmartRhythm(aphorismText, cardId) : [];
    var lines = rawLines.map(function(line) {
        return adaptQuotationMarks(line, currentAspectMode);
    });

    ensureKaiFontLoaded(lines.join('')).then(function() {
    drawLandscapeBackground(ctx, canvasW, canvasH, function() {
        var fontKai = '"DFKai-SB", "Microsoft DFKai-SB", "標楷體", "BiauKai", "Kaiti TC", "Kaiti SC", "LXGW WenKai TC", "楷體", serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.95)'; 
        ctx.shadowBlur = 18 * CANVAS_SCALE;

        var finalFontSize = 36; 

        if (lines.length > 0) {
            if (currentAspectMode === 'landscape') {
                var startTop = canvasH * (2 / 5); 
                var endMax = canvasH * (3 / 5);   
                var availableZoneH = endMax - startTop; 

                var maxCharCount = 0;
                for (var m = 0; m < lines.length; m++) {
                    if (lines[m].length > maxCharCount) {
                        maxCharCount = lines[m].length;
                    }
                }

                var targetWidth = canvasW * 0.70; 
                var unifiedFontSize = Math.floor(targetWidth / (maxCharCount || 1));

                var maxFontLimit = 64;
                if (aphorismText.indexOf("行為言語") !== -1 || aphorismText.indexOf("在人事歷練中不求聰明") !== -1) {
                    unifiedFontSize = Math.floor(unifiedFontSize * 1.15);
                    maxFontLimit = 72;
                }

                if (aphorismText.indexOf("面對紛雜的氣氛") !== -1) {
                    unifiedFontSize = Math.floor(unifiedFontSize * 0.68);
                }

                if (unifiedFontSize > maxFontLimit) unifiedFontSize = maxFontLimit;
                if (unifiedFontSize < 28) unifiedFontSize = 28;

                finalFontSize = unifiedFontSize;
                var lineHeight = Math.floor(unifiedFontSize * 1.22);
                ctx.font = 'bold ' + unifiedFontSize + 'px ' + fontKai;

                if (cardId === 'custom_input') {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    var totalBlockH = lines.length * lineHeight;
                    var startY = (canvasH - totalBlockH) / 2;

                    for (var i = 0; i < lines.length; i++) {
                        ctx.fillText(lines[i], canvasW / 2, startY + (i * lineHeight) + (lineHeight / 2));
                    }
                } else {
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';

                    var totalBlockH = lines.length * lineHeight;
                    var startY = startTop + (availableZoneH - totalBlockH) / 2;
                    var startX = canvasW * 0.15;

                    // 🌸 有選早午晚安時，問候字在左上角：金句往下讓開，放不下就把字稍微縮小，避免和問候字重疊
                    if (currentSelectedGreeting !== "") {
                        var bottomLimit = canvasH - 20;
                        var minTop = 18 + Math.max(40, Math.floor(unifiedFontSize * 1.25)) + 8;
                        if (startY + totalBlockH > bottomLimit || startY < minTop) {
                            if (minTop + totalBlockH > bottomLimit) {
                                unifiedFontSize = Math.floor((bottomLimit - 26) / (1.25 + 1.22 * lines.length));
                                if (unifiedFontSize < 24) unifiedFontSize = 24;
                                finalFontSize = unifiedFontSize;
                                lineHeight = Math.floor(unifiedFontSize * 1.22);
                                totalBlockH = lines.length * lineHeight;
                                ctx.font = 'bold ' + unifiedFontSize + 'px ' + fontKai;
                                minTop = 18 + Math.max(40, Math.floor(unifiedFontSize * 1.25)) + 8;
                            }
                            if (startY < minTop) startY = minTop;
                        }
                    }

                    for (var i = 0; i < lines.length; i++) {
                        ctx.fillText(lines[i], startX, startY + (i * lineHeight));
                    }
                }
            } else {
                var topPadding = 60;                        
                var bottomPadding = 60;                     
                var availableH = canvasH - topPadding - bottomPadding;

                var maxCharCountInLines = 0;
                for (var k = 0; k < lines.length; k++) {
                    if (lines[k].length > maxCharCountInLines) {
                        maxCharCountInLines = lines[k].length;
                    }
                }

                var unifiedFontSize = Math.floor(availableH / maxCharCountInLines);
                if (unifiedFontSize > 72) unifiedFontSize = 72; 
                if (unifiedFontSize < 32) unifiedFontSize = 32; 

                if (aphorismText.indexOf("面對紛雜的氣氛") !== -1) {
                    unifiedFontSize = Math.floor(unifiedFontSize * 0.72);
                }

                finalFontSize = unifiedFontSize;
                ctx.font = 'bold ' + unifiedFontSize + 'px ' + fontKai;

                if (cardId === 'custom_input') {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    var lineCount = lines.length;
                    var colWidth = unifiedFontSize * 1.35;
                    var totalW = lineCount * colWidth;
                    var startX = (canvasW + totalW) / 2 - (colWidth / 2);

                    for (var lineIdx = 0; lineIdx < lineCount; lineIdx++) {
                        var lineText = lines[lineIdx];
                        var charCount = lineText.length;
                        if (charCount === 0) continue;

                        var currentX = startX - (lineIdx * colWidth);
                        var totalH = charCount * unifiedFontSize * 1.08;
                        var startY = (canvasH - totalH) / 2;
                        if (startY < topPadding) startY = topPadding;

                        for (var charIdx = 0; charIdx < charCount; charIdx++) {
                            var singleChar = lineText[charIdx];
                            var currentY = startY + (charIdx * unifiedFontSize * 1.08);

                            ctx.fillText(singleChar, currentX, currentY);
                        }
                    }
                } else {
                    var rightStart = 50;                       
                    var leftBoundary = canvasW * (2 / 3);       
                    var availableW = leftBoundary - rightStart; 

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';

                    var colSpacing = (lines.length > 1) ? Math.floor(availableW / (lines.length - 1)) : availableW;
                    if (colSpacing > 85) colSpacing = 85;

                    for (var lineIdx = 0; lineIdx < lines.length; lineIdx++) {
                        var lineText = lines[lineIdx];
                        var charCount = lineText.length;
                        if (charCount === 0) continue;

                        var currentX = canvasW - rightStart - (lineIdx * colSpacing);
                        
                        for (var charIdx = 0; charIdx < charCount; charIdx++) {
                            var singleChar = lineText[charIdx];
                            var currentY = topPadding + (charIdx * unifiedFontSize * 1.08);

                            ctx.fillText(singleChar, currentX, currentY);
                        }
                    }
                }
            }
        }

        var isSingleAphorism = (currentSelectedCardId !== '9999' && currentSelectedCardId !== 'custom_input' && currentSelectedCardId !== null && lines.length > 0);

        if (isSingleAphorism) {
            var tagX = 45;
            var tagFontSize = Math.floor(finalFontSize * 0.65);
            if (tagFontSize < 18) tagFontSize = 18;

            var tagText = "靜思語錄";

            ctx.font = 'bold ' + tagFontSize + 'px ' + fontKai;
            ctx.fillStyle = '#ffffff';

            if (currentAspectMode === 'landscape') {
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                var marginX = 45;
                var marginY = 35;
                ctx.fillText(tagText, canvasW - marginX, canvasH - marginY);
            } else {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                var tagStartY = canvasH - 50 - (tagText.length * tagFontSize * 1.1); 

                for (var tIdx = 0; tIdx < tagText.length; tIdx++) {
                    var tChar = tagText[tIdx];
                    var tY = tagStartY + (tIdx * tagFontSize * 1.1);
                    ctx.fillText(tChar, tagX, tY);
                }
            }
        }

        if (currentSelectedGreeting !== "") {
            var greetingFontSize = Math.floor(finalFontSize * 1.25);
            if (greetingFontSize < 40) greetingFontSize = 40;

            var renderGreetingStr = "";

            if (currentSelectedGreeting === '日安') {
                var randomDaytimeWord = daytimeGreetingsPool[Math.floor(Math.random() * daytimeGreetingsPool.length)];
                renderGreetingStr = randomDaytimeWord;
                if (currentAspectMode === 'landscape') {
                    renderGreetingStr += '~';
                }
            } else if (currentSelectedGreeting === '早安') {
                renderGreetingStr = (currentAspectMode === 'landscape') ? '早安!' : '早安';
            } else if (currentSelectedGreeting === '晚安') {
                renderGreetingStr = '晚安';
            }

            if (lines.length === 0) {
                greetingFontSize = (currentAspectMode === 'landscape') ? 64 : 56;
            }

            ctx.font = 'bold ' + greetingFontSize + 'px ' + fontKai;
            ctx.fillStyle = '#ffffff';

            if (lines.length === 0) {
                if (currentAspectMode === 'landscape') {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(renderGreetingStr, canvasW / 2, canvasH / 2);
                } else {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    var gLen = renderGreetingStr.length;
                    var totalGH = gLen * greetingFontSize * 1.1;
                    var centerStartY = (canvasH - totalGH) / 2;

                    for (var gIdx = 0; gIdx < renderGreetingStr.length; gIdx++) {
                        var gChar = renderGreetingStr[gIdx];
                        var gY = centerStartY + (gIdx * greetingFontSize * 1.1);
                        ctx.fillText(gChar, canvasW / 2, gY);
                    }
                }
            } else {
                if (currentAspectMode === 'landscape') {
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    var gX = 30;
                    var gY = 18;
                    ctx.fillText(renderGreetingStr, gX, gY);
                } else {
                    ctx.textAlign = 'left'; 
                    ctx.textBaseline = 'top';
                    var tagX = 45;
                    var tagFontSize = Math.floor(finalFontSize * 0.65);
                    var gX = tagX - tagFontSize + 3; 
                    var gStartY = topPadding;

                    for (var gIdx = 0; gIdx < renderGreetingStr.length; gIdx++) {
                        var gChar = renderGreetingStr[gIdx];
                        var gY = gStartY + (gIdx * greetingFontSize * 1.1);
                        ctx.fillText(gChar, gX, gY);
                    }
                }
            }
        }
        
        ctx.shadowBlur = 0; 
        
        if (imgOverlay) {
            imgOverlay.src = canvas.toDataURL('image/jpeg', 0.95);
            // 🌸 電腦上滑鼠停在圖上，會顯示背景圖編號，方便指定要調整哪一張
            imgOverlay.title = currentBackgroundNo ? ('背景圖 #' + currentBackgroundNo) : '';
        }
        // 🌸 先把問候圖轉成檔案備用，按 LINE 鈕時才能立刻交給手機分享
        if (canvas.toBlob) {
            canvas.toBlob(function(blob) {
                currentShareFile = blob ? new File([blob], '靜思問候圖.jpg', { type: 'image/jpeg' }) : null;
            }, 'image/jpeg', 0.95);
        }

        modal.style.display = 'flex';
    });
    });
}

    document.getElementById('morningModal').style.display = 'none';
}

function downloadCurrentMorningImage() {
    if (!currentModalText && currentSelectedGreeting === "") return;
    
    var canvas = document.getElementById('morningCanvas');
    var link = document.createElement('a');
    var fileName = "";

    if (currentSelectedCardId === 'custom_input') {
        fileName = '自訂問候圖.jpg';
    } else if (currentSelectedCardId === '9999') {
        aiImageDownloadCounter++;
        fileName = '自創語錄圖' + aiImageDownloadCounter + '.jpg';
    } else {
        var numericId = currentSelectedCardId ? parseInt(currentSelectedCardId, 10) : null;
        var foundCard = numericId ? aphorismsData.find(function(item){ return item.id === numericId || item.origId === numericId; }) : null;
        var nValue = foundCard ? foundCard.origId : (numericId || 1);

// 🌸 判斷是否為手機或平板（iPad 新版會偽裝成 Mac，用觸控點判斷）
function isMobileDevice() {
    var ua = navigator.userAgent || '';
    if (/Android|iPhone|iPad|iPod/i.test(ua)) return true;
    if (/Macintosh/i.test(ua) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1) return true;
    return false;
}

// 🌸 畫面下方的提示訊息
function showToast(message, durationMs) {
    var toast = document.getElementById('appToast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'appToast';
        toast.className = 'app-toast';
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function() { toast.classList.remove('show'); }, durationMs || 4000);
}

// 🌸 電腦上：把問候圖複製到剪貼簿，再到電腦版 LINE 貼上
function copyMorningImageToClipboard() {
    var canvas = document.getElementById('morningCanvas');
    var pasteKey = /Mac/i.test(navigator.platform || navigator.userAgent || '') ? '⌘+V' : 'Ctrl+V';

    function fallbackDownload() {
        downloadCurrentMorningImage();
        showToast('圖片已下載，請把圖片拖進電腦版 LINE 的聊天視窗傳送。', 5000);
    }

    if (!canvas || !navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem === 'undefined') {
        fallbackDownload();
        return;
    }

    try {
        var pngPromise = new Promise(function(resolve, reject) {
            canvas.toBlob(function(blob) { blob ? resolve(blob) : reject(new Error('no blob')); }, 'image/png');
        });
        navigator.clipboard.write([new ClipboardItem({ 'image/png': pngPromise })])
            .then(function() {
                showToast('圖片已複製! 可到電腦版 LINE 的聊天視窗輸入格裡直接按鍵 ' + pasteKey + ' 貼上後傳送。', 5000);
            })
            .catch(function() { fallbackDownload(); });
    } catch (e) {
        fallbackDownload();
    }
}

// 🌸 按 LINE 鈕：
//    手機 → 跳出分享選單，選 LINE → 選好友，直接傳出問候圖
//    電腦 → 把問候圖複製到剪貼簿，到電腦版 LINE 貼上
function shareToLine() {
    if (isLineInAppBrowser()) {
        var goText = confirm('LINE 內建瀏覽器無法直接分享圖片。\n\n按「確定」：改傳文字\n按「取消」：可先改用瀏覽器開啟，再分享圖片');
        if (goText) shareTextToLine();
        return;
    }
    if (!isMobileDevice()) {
        copyMorningImageToClipboard();
        return;
    }
    if (currentShareFile && navigator.canShare && navigator.canShare({ files: [currentShareFile] })) {
        navigator.share({ files: [currentShareFile] })
            .catch(function(err) {
                if (err && err.name === 'AbortError') return; // 使用者按取消，不做事
                shareTextToLine();
            });
        return;
    }
    shareTextToLine();
}

// 🌸 不支援分享圖片時（例如部分電腦瀏覽器），改用原本的方式：開啟 LINE 傳文字，可選擇好友
function shareTextToLine() {
    var bodyText = currentModalText ? currentModalText.trim() : "";
    if (!bodyText) return;

    var shareMessage;
    if (currentSelectedCardId === '9999') {
        shareMessage = "開示金句: " + bodyText;          // 自創金句
    } else if (currentSelectedCardId === 'custom_input') {
        shareMessage = bodyText;                          // 自己輸入的文字，原樣傳送
    } else {
        shareMessage = "靜思語錄: " + bodyText;          // 靜思語錄原句
    }

    var lineUrl = "https://line.me/R/msg/text/?" + encodeURIComponent(shareMessage);
    window.open(lineUrl, '_blank');
}

function renderUI(isInitial, explicitPickedTags, isLeastShowMode, resetPlaceholderToDefault, activeInputText) {
    var list = document.getElementById('resultsList');
    if (!list) return;

    var inputElem = document.getElementById('userPrompt');
    if (resetPlaceholderToDefault && inputElem) {
        inputElem.placeholder = defaultPlaceholderText;
    }

    var selected = [];
    var usedIdMap = {};
    var hitTagsFromInput = []; 

    if (isInitial) {
        var shuffledPool = aphorismsData.slice().sort(function() { return 0.5 - Math.random(); });
        for (var i = 0; i < shuffledPool.length; i++) {
            if (selected.length >= 3) break;
            pushUniqueCard(selected, shuffledPool[i], usedIdMap);
        }
    } else {
        var hasInput = (activeInputText && activeInputText !== "");
        var handTags = explicitPickedTags.slice();

        if (isLeastShowMode) {
            var leastExposedCards = sortByExposureAndRandom(aphorismsData);
            for (var lc = 0; lc < leastExposedCards.length && selected.length < 3; lc++) {
                pushUniqueCard(selected, leastExposedCards[lc], usedIdMap);
            }
        } else if (!hasInput) {
            selected = getCardsByTags(handTags, 3, usedIdMap);
        } else {
            hitTagsFromInput = extractKeywordsFromText(activeInputText);

            var prefixMatched = sortByExposureAndRandom(aphorismsData.filter(function(item) {
                return !usedIdMap[item.id] && item.content.indexOf(activeInputText) === 0;
            }));
            prefixMatched.forEach(function(c) { pushUniqueCard(selected, c, usedIdMap); });

            if (selected.length < 3) {
                var contentMatched = sortByExposureAndRandom(aphorismsData.filter(function(item) {
                    return !usedIdMap[item.id] && item.content.indexOf(activeInputText) !== -1;
                }));
                contentMatched.forEach(function(c) { pushUniqueCard(selected, c, usedIdMap); });
            }

            if (selected.length < 3 && hitTagsFromInput.length > 0) {
                var tier1Cards = getCardsByTags(hitTagsFromInput, 3 - selected.length, usedIdMap);
                tier1Cards.forEach(function(c) { pushUniqueCard(selected, c, usedIdMap); });
            }

            if (selected.length < 3) {
                var scoredCards = aphorismsData.map(function(item) {
                    return {
                        item: item,
                        score: calculateSemanticScore(item.content, activeInputText)
                    };
                }).filter(function(o) {
                    return o.score > 0 && !usedIdMap[o.item.id];
                });

                scoredCards.sort(function(a, b) {
                    if (b.score !== a.score) return b.score - a.score;
                    var cA = aphorismShowCounts[a.item.id] || 0;
                    var cB = aphorismShowCounts[b.item.id] || 0;
                    if (cA === cB) return 0.5 - Math.random();
                    return cA - cB;
                });

                for (var sc = 0; sc < scoredCards.length && selected.length < 3; sc++) {
                    pushUniqueCard(selected, scoredCards[sc].item, usedIdMap);
                }
            }

            if (selected.length < 3 && handTags.length > 0) {
                var tier3Cards = getCardsByTags(handTags, 3 - selected.length, usedIdMap);
                tier3Cards.forEach(function(c) { pushUniqueCard(selected, c, usedIdMap); });
            }

            if (selected.length < 3) {
                var globalFb = sortByExposureAndRandom(aphorismsData);
                for (var gf = 0; gf < globalFb.length && selected.length < 3; gf++) {
                    pushUniqueCard(selected, globalFb[gf], usedIdMap);
                }
            }
        }
    }

    var currentIds = selected.map(function(item) { return item.id; });
    if (currentIds.length === 3 && lastDisplayedIds.length === 3) {
        var isSameSet = currentIds.every(function(id) { return lastDisplayedIds.indexOf(id) !== -1; });
        if (isSameSet) {
            selected.sort(function() { return 0.5 - Math.random(); });
        }
    }
    lastDisplayedIds = selected.map(function(item) { return item.id; });
    currentDisplayedCards = selected.slice();

    selected.forEach(function(item) {
        aphorismShowCounts[item.id] = (aphorismShowCounts[item.id] || 0) + 1;
    });

    buildTopKeywordsByRules(selected, activeInputText, hitTagsFromInput);
    renderKeywordsHeader();

    list.innerHTML = '';

    for (var s = 0; s < selected.length; s++) {
        var item = selected[s];

        var card = document.createElement('div'); card.className = 'card';
        var mainBody = document.createElement('div'); mainBody.className = 'card-main-body';

        var contentP = document.createElement('p'); contentP.className = 'card-content'; contentP.textContent = item.content;
        
        var rightSide = document.createElement('div'); rightSide.className = 'card-right-side';

        var speakBtn = document.createElement('button');
        speakBtn.className = 'btn-speak'; speakBtn.innerHTML = '🔊'; speakBtn.type = 'button'; speakBtn.title = '點擊朗讀';
        (function(textToSpeak, btn){ speakBtn.onclick = function() { speakText(textToSpeak, btn); }; })(item.content, speakBtn);

        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'card-checkbox';
        checkbox.setAttribute('data-card-id', item.id);
        checkbox.onchange = function() {
            var customCb = document.getElementById('customInputCheckbox');
            if (customCb && customCb.checked) customCb.checked = false;
            var aiCheckbox = document.querySelector('.ai-card .card-checkbox');
            if (aiCheckbox && aiCheckbox.checked) aiCheckbox.checked = false;
            updateAiButtonState();
        };

        rightSide.appendChild(speakBtn); 
        rightSide.appendChild(checkbox);
        rightSide.appendChild(createQuoteLinkSpan(item.origId));
        rightSide.appendChild(createQuoteCopyButton(item.origId));

        mainBody.appendChild(contentP); 
        mainBody.appendChild(rightSide);

        var metaDiv = document.createElement('div'); metaDiv.className = 'card-meta';
        var tagContainer = document.createElement('div'); tagContainer.className = 'tag-list-container';

        var orderedCardTags = [];
        if (selectedUserTags && selectedUserTags.length > 0) {
            for (var st = 0; st < selectedUserTags.length; st++) {
                var userTag = selectedUserTags[st];
                if (cardHasExactTag(item, userTag) && orderedCardTags.indexOf(userTag) === -1) {
                    orderedCardTags.push(userTag);
                }
            }
        }
        for (var mt = 0; mt < item.semanticTags.length; mt++) {
            var origT = item.semanticTags[mt];
            if (orderedCardTags.indexOf(origT) === -1) {
                orderedCardTags.push(origT);
            }
        }

        var displayCardTags = orderedCardTags;
        for (var t = 0; t < displayCardTags.length; t++) {
            (function(tag){
                var tb = document.createElement('button'); tb.className = 'card-tag-btn';
                if (selectedUserTags.indexOf(tag) !== -1) tb.classList.add('active');
                tb.textContent = tag; tb.type = 'button';
                tb.onclick = function() { toggleTagSelection(tag); };
                tagContainer.appendChild(tb);
            })(displayCardTags[t]);
        }

        metaDiv.appendChild(tagContainer);
        card.appendChild(mainBody); card.appendChild(metaDiv);
        list.appendChild(card);
    }

    ensureButtonsInDefaultPos();
    updateAiButtonState();
}

// 🌸 是否在 LINE 內建瀏覽器中開啟
function isLineInAppBrowser() {
    return /\bLine\//i.test(navigator.userAgent || '');
}

// 🌸 這句金句的分享網址，例如 https://s.rayshieh.com/?openExternalBrowser=1#158
function buildQuoteUrl(num) {
    return location.origin + location.pathname + '?openExternalBrowser=1#' + num;
}

// 🌸 複製後的提示句（兩行置中）
var QUOTE_COPIED_MESSAGE = '已複製該金句的網址與文字供貼到\n其它輸入格如 LINE 聊天室給朋友。';

// 🌸 自創結緣語無法用網址重現，所以附上網站首頁網址
function buildHomeUrl() {
    return location.origin + location.pathname + '?openExternalBrowser=1';
}

// 🌸 複製自創結緣語
function copyAiAphorismToClipboard(text, btn) {
    var copyText = '開示金句：' + text + '\n' + buildHomeUrl();
    var done = function() {
        showToast(QUOTE_COPIED_MESSAGE, 4000);
        if (btn) showCopyTooltip(btn);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText).then(done).catch(function() { legacyCopy(copyText); done(); });
    } else {
        legacyCopy(copyText); done();
    }
}

// 🌸 複製金句文字與分享網址
function copyQuoteToClipboard(num, btn) {
    var found = aphorismsData.find(function(item) { return item.origId === num; });
    var copyText = (found ? '靜思語句：' + found.content + '\n' : '') + buildQuoteUrl(num);
    var done = function() {
        showToast(QUOTE_COPIED_MESSAGE, 4000);
        if (btn && btn.classList && btn.classList.contains('btn-copy')) showCopyTooltip(btn);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText).then(done).catch(function() { legacyCopy(copyText); done(); });
    } else {
        legacyCopy(copyText); done();
    }
}

// 🌸 喇叭下方的金句編號（點一下也會複製）
function createQuoteLinkSpan(num) {
    var span = document.createElement('span');
    span.className = 'quote-number';
    span.textContent = '#' + num;
    span.title = '複製這句金句的文字與分享網址';
    span.onclick = function() { copyQuoteToClipboard(num, null); };
    return span;
}

// 🌸 方塊下方的複製鈕
function createQuoteCopyButton(num) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-copy quote-copy-btn';
    btn.innerHTML = copySvg;
    btn.title = '複製這句金句的文字與分享網址';
    btn.onclick = function() { copyQuoteToClipboard(num, btn); };
    return btn;
}

function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
}

// 🌸 網址帶 #編號 時，直接顯示那一句；否則照原本隨機顯示
function openFromUrlHash() {
    var m = (location.hash || '').match(/^#(\d+)$/);
    if (m && parseInt(m[1], 10) > 0) {
        handleNumberDirectSearch(parseInt(m[1], 10), document.getElementById('userPrompt'));
        return true;
    }
    return false;
}

window.addEventListener('hashchange', openFromUrlHash);
window.addEventListener('resize', fitBottomButtonText);

if (isLineInAppBrowser()) {
    var lineBanner = document.getElementById('lineIabBanner');
    var lineLink = document.getElementById('lineIabOpenLink');
    if (lineBanner) lineBanner.style.display = 'block';
    if (lineLink) lineLink.href = location.origin + location.pathname + '?openExternalBrowser=1' + (location.hash || '');
}

if (!openFromUrlHash()) {
    renderUI(true);
}
</script>
